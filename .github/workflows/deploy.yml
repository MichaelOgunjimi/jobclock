name: Migrate & Deploy

# Runs on every push to main.
# Migrations run first — the Vercel deploy is skipped if they fail.
# Vercel's automatic GitHub deployment must be disabled so this
# workflow is the only path to production.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL   — direct Postgres connection string (port 5432, not pooler)
#   VERCEL_TOKEN   — from vercel.com/account/tokens
#
# VERCEL_ORG_ID and VERCEL_PROJECT_ID are read from the committed
# .vercel/project.json so they don't need to be secrets.

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          export VERCEL_ORG_ID=$(node -p "require('./.vercel/project.json').orgId")
          export VERCEL_PROJECT_ID=$(node -p "require('./.vercel/project.json').projectId")
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
