name: Migrate & Deploy

# Runs on every push to main.
# Migrations run first — the Vercel deploy is skipped if they fail.
# Vercel's automatic GitHub deployment must be disabled so this
# workflow is the only path to production.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL        — direct Postgres connection string (port 5432, not pooler)
#   VERCEL_TOKEN        — from vercel.com/account/tokens (scope: your personal account or team)
#   VERCEL_ORG_ID       — "orgId" from .vercel/project.json (not committed — add as secret)
#   VERCEL_PROJECT_ID   — "projectId" from .vercel/project.json (not committed — add as secret)

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    name: Run DB migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
